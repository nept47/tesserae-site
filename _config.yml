# Publish .well-known/assetlinks.json, which Jekyll skips like every dot folder.
include:
  - .well-known

# Every Markdown page (Privacy, Terms, Refunds, Delete account) gets the site's own look from _layouts/default.html.
defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: en
exclude:
  - README.md

# Site languages (nept47/Tesserae#448), in switcher order. Strings in _data/i18n/<lang>.yml.
url: https://tesserae.nept47.dev
languages: [en, fr, es, de, nl, it, el]
